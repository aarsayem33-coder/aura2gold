<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Aura Gold">
  <title>Aura Gold</title>
  <defs>
    <!-- Gold disc: light top-left to deep amber bottom-right so the circle reads as a
         coin even at 16px, where a flat fill looks like a plain dot. -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.45" stop-color="#f5b324"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Disc + rim. The dark rim keeps the icon separated from light browser tabs. -->
  <circle cx="32" cy="32" r="31" fill="url(#g)"/>
  <circle cx="32" cy="32" r="31" fill="none" stroke="#0f172a" stroke-opacity="0.35" stroke-width="2"/>

  <!-- "A" drawn as strokes: at favicon sizes thick round strokes stay legible where a
       thin glyph outline would smear. -->
  <g fill="none" stroke="#0f172a" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 47 L32 16 L44 47"/>
    <path d="M25.2 36.5 H38.8"/>
  </g>
</svg>
